name: ApeosManager
options:
  bundleIdPrefix: nz.co.myers
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  # The administrator's fleet manager.
  ApeosManager:
    type: application
    platform: macOS
    sources: [Sources/Shared, Sources/Admin, Resources/AppIcon.icns]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Apeos Manager
        # Without this the About panel and the app menu read "ApeosManager": both take
        # CFBundleName, which defaults to PRODUCT_NAME, not CFBundleDisplayName.
        CFBundleName: Apeos Manager
        NSHumanReadableCopyright: "© 2026 Tony Myers. MIT licence."
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: "Apeos Manager connects to your printers on the local network to read status and manage settings."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/ApeosManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true

  # The end user's own quota monitor. Shares the models and the transport, none of the
  # administrative UI, and signs in only as the person sitting in front of it.
  ApeosQuota:
    type: application
    platform: macOS
    sources: [Sources/Shared, Sources/Quota, Resources/AppIcon.icns]
    info:
      path: Resources/ApeosQuota-Info.plist
      properties:
        CFBundleDisplayName: Apeos Quota
        CFBundleName: Apeos Quota
        NSHumanReadableCopyright: "© 2026 Tony Myers. MIT licence."
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        # Lives in the menu bar, not the Dock. The detail window is opened from there.
        LSUIElement: true
        NSLocalNetworkUsageDescription: "Apeos Quota connects to your printers on the local network to read your own printing quota."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/ApeosQuota.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
